name: Discord development updates

on:
  workflow_call:
    inputs:
      launcher_preview:
        type: string
        required: false
        default: ''
    secrets:
      DISCORD_DEVELOPMENT_WEBHOOK_URL:
        required: true
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event_name == 'push' && !github.event.deleted && github.run_attempt == '1' && !endsWith(github.actor, '[bot]') }}
    concurrency:
      group: discord-development-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bundle quick successive pushes
        run: sleep 25
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that this build is still current
        id: latest
        run: |
          read -r latest _ < <(git ls-remote --exit-code origin refs/heads/main)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'send=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the Android launcher screenshot
        if: ${{ steps.latest.outputs.send == 'true' && inputs.launcher_preview != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.launcher_preview }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - name: Send one Discord update
        if: steps.latest.outputs.send == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
        run: node .github/scripts/discord-development.mjs post
      - name: Remember the Discord message for its release
        if: steps.latest.outputs.send == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discord-message-${{ github.sha }}
          path: ${{ runner.temp }}/discord-message.json
          retention-days: 90
          if-no-files-found: error

  release:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    concurrency: discord-development-release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Find the published build and its Discord message
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/discord-development.mjs lookup
      - name: Restore the matching Discord message ID
        if: steps.lookup.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.lookup.outputs.artifact_id }}
          run-id: ${{ steps.lookup.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/discord-release
      - name: Add the release to the existing Discord embed
        if: steps.lookup.outputs.artifact_id != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
        run: node .github/scripts/discord-development.mjs edit

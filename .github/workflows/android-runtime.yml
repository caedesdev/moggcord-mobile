name: Discord Android startup experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-runtime.yml'
      - '.github/scripts/android-runtime-ci.sh'

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
      - name: Assemble debug launcher
        run: |
          npm ci
          npm run build
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          gradle -p android :loader:assembleDebug
      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Compare original and cloned Discord startup
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/android-runtime-ci.sh
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discord-352017-startup-api36-x86_64
          path: dist/android-runtime-ci/
          if-no-files-found: ignore
          retention-days: 5

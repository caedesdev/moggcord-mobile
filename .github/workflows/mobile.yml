name: Build Moggcord Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    name: Shared payload tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    name: Android launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: shared
    outputs:
      launcher_preview: ${{ steps.upload-preview.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.13"
      - run: npm ci
      - run: npm run build
      - name: Assemble launcher APKs
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          gradle -p android :loader:assembleDebug :loader:assembleRelease
      - name: Verify APK and its embedded payload
        run: |
          apk=android/loader/build/outputs/apk/debug/loader-debug.apk
          release=android/loader/build/outputs/apk/release/loader-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          for package in "$apk" "$release"; do
            unzip -p "$package" assets/moggcord-mobile.js | cmp - dist/moggcord-mobile.js
            test "$(unzip -p "$package" assets/xposed_init)" = cc.moggcord.mobile.loader.MoggcordLoader
            for payload in loader.dex metaloader.dex so/arm64-v8a/liblspatch.so so/armeabi-v7a/liblspatch.so so/x86/liblspatch.so so/x86_64/liblspatch.so; do
              unzip -p "$package" "assets/lspatch/$payload" | cmp "android/loader/build/generated/patcher/assets/lspatch/$payload"
            done
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$package" | grep -F "launchable-activity: name='cc.moggcord.mobile.loader.LauncherActivity'"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$release" | grep -F "package: name='cc.moggcord.mobile.launcher'"
          mkdir -p dist/artifact-android
          cp "$apk" dist/artifact-android/Moggcord-Android-Launcher-debug.apk
          cp "$release" dist/artifact-android/Moggcord-Android-Launcher-unsigned.apk
          cp LICENSE NOTICE.md android/README.md dist/artifact-android/
          cp runtime/LICENSE dist/artifact-android/LICENSE-MOBILE-RUNTIME
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Moggcord-Mobile-Android-dev
          path: dist/artifact-android
          if-no-files-found: error
      - name: Enable KVM for the Android preview
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-moggcord-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the Android launcher
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        id: capture-preview
        continue-on-error: true
        timeout-minutes: 8
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/capture-android-launcher.sh dist/artifact-android/Moggcord-Android-Launcher-debug.apk dist/discord-preview/moggcord-android-launcher.png
      - name: Save the launcher preview
        if: steps.capture-preview.outcome == 'success'
        id: upload-preview
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Moggcord-Android-Launcher-Preview
          path: dist/discord-preview/moggcord-android-launcher.png
          retention-days: 14
          if-no-files-found: error

  development-update:
    name: Discord development update
    needs: android
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/discord-development.yml
    with:
      launcher_preview: ${{ needs.android.outputs.launcher_preview }}
    secrets:
      DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}

  ios:
    name: iOS loader
    runs-on: macos-15
    timeout-minutes: 15
    needs: shared
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test signed runtime updates and startup recovery
        run: bash scripts/test-ios-updates.sh
      - name: Test native platform indicator rendering on iOS
        run: bash scripts/test-ios-platform-icons.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Moggcord-Mobile-native-icons-preview
          path: dist/tests/platform-indicators-*
          if-no-files-found: error
      - run: bash scripts/build-ios.sh
      - name: Verify the iOS library and its embedded payload
        run: |
          xcrun vtool -show-build dist/ios/MoggcordMobile.dylib
          node --input-type=module -e 'import fs from "node:fs"; if (!fs.readFileSync("dist/ios/MoggcordMobile.dylib").includes(fs.readFileSync("dist/moggcord-mobile.js"))) process.exit(1)'
          mkdir -p dist/artifact-ios
          cp dist/ios/MoggcordMobile.dylib LICENSE NOTICE.md ios/README.md ios/vendor/LICENSE-META dist/artifact-ios/
          cp runtime/LICENSE dist/artifact-ios/LICENSE-MOBILE-RUNTIME
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Moggcord-Mobile-iOS-dev
          path: dist/artifact-ios
          if-no-files-found: error
